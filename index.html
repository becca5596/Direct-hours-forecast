
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Direct Hours Forecast Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.1.0"></script>
  <script src="forecast.js" defer></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    canvas { max-width: 1000px; }
    #controls { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>Direct Hours Forecast Dashboard</h2>
  <div id="controls">
    Region:
    <select id="regionSelect"></select>
    Month Range:
    <input type="range" id="monthSlider" min="0" max="7" value="7" />
    <span id="monthLabel">Jan–Aug</span>
    <button id="downloadBtn">📥 Download CSV</button>
  </div>
  <canvas id="forecastChart" height="400"></canvas>
</body>
</html>
